[project]
name = "monograph-splitter"
version = "0.3.1"
description = "Per-entry PDF excerpts from a scanned reference book: finds where each monograph starts and ends on a two-column page and cuts there, with real redaction of the neighbours' share of a shared page."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shuma" }]
keywords = ["pdf", "ocr", "textbook", "monograph", "excerpt", "pymupdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing",
]
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
review = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
monograph-splitter = "monograph_splitter.cli:main_entry"
monograph-splitter-diff = "monograph_splitter.diff_manifest:main_entry"
monograph-splitter-review = "monograph_splitter.review.server:main_entry"

[project.urls]
Repository = "https://github.com/BigSpoon33/pdf-splitter-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monograph_splitter"]

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
