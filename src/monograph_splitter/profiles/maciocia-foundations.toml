# Layout profile: Maciocia, The Foundations of Chinese Medicine, 3rd ed (2015, Elsevier).
# Digital text (no OCR), two-column, W=535.7 H=697.3. Third book (Inkwell STORY-220) and
# the first with NO header label blocks — a pattern is introduced by a bare 12.5pt heading,
# so anchors come from the entries' heading text located on the start sheet
# ([anchors] source = "headings"). Every value below was measured on the PDF.
name = "maciocia-foundations"
description = "Maciocia, The Foundations of Chinese Medicine 3rd ed (digital text, two-column, heading-anchored)"

[book]
sheet_offset = 29            # printed page N is sheet N+28 — calibrated from the folio on 20 Part 6 sheets

[anchors]
source = "headings"
heading_min_size = 11.5      # pattern headings 12.5 Bold, sub-headings 12.0 Semibold, group banners 13.0; body 9.5
heading_wrap_gap = 16.0      # a wrapped heading's line tops sit 13.5pt apart; the next sub-heading is 19pt+ below
heading_pad = 3.0            # a banner can sit 1–6pt above a heading: the cut clamps into that gap
heading_match = 0.85

[layout]
header_band = 46.0           # the running part number ("6", 20.5pt) spans y 26–51; the first body line starts at 47.6
redact_top = 52.0            # redaction starts below the part number's glyph box; a body line starting at 47.6 still intersects
subheader_bottom = 52.0      # no running sub-header in this book — the strip above a column-bound start has zero height
footer_band = 36.0           # the folio (8pt) sits at y 664–674 of 697.3
column_split = 0.45          # left column x0 40–104, right column x0 ≥ 269 (W 535.7) — no line is wider than 0.55·W
full_width_ratio = 0.55

[title]
script_regex = ""            # no CJK title lines — the script rule is off (label detection is not used at all)

[breaks]
patterns = []                # chapter tails are explicit `stop` entries; there are no Summary/TOC pages to detect

[limits]
max_span = 30                # a section entry (Ch30 "Hot–Cold") runs 5–7 printed pages; patterns 1–5
long_span = 12
